<!DOCTYPE html>
<html lang="en-CA" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}} | Tim Hortons Menu Canada</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <link rel="canonical" href="{{CANONICAL}}">
  <meta name="theme-color" content="#C8102E">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/favicon.svg">

  <!-- Social sharing -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="en_CA">
  <meta property="og:site_name" content="Tim Hortons Menu Canada">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:url" content="{{CANONICAL}}">
  <meta property="og:image" content="https://timhortons-menu.vercel.app/assets/img/og-cover.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{TITLE}}">
  <meta name="twitter:description" content="{{DESCRIPTION}}">
  <meta name="twitter:image" content="https://timhortons-menu.vercel.app/assets/img/og-cover.jpg">

  <!-- Structured data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "WebSite",
        "@id": "https://timhortons-menu.vercel.app/#website",
        "name": "Tim Hortons Menu Canada",
        "url": "https://timhortons-menu.vercel.app/",
        "inLanguage": "en-CA"
      },
      {
        "@type": "WebPage",
        "name": "{{TITLE_JSON}}",
        "url": "{{CANONICAL}}",
        "inLanguage": "en-CA",
        "isPartOf": { "@id": "https://timhortons-menu.vercel.app/#website" }
      },
      {
        "@type": "BreadcrumbList",
        "itemListElement": [
          { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://timhortons-menu.vercel.app/" },
          { "@type": "ListItem", "position": 2, "name": "{{TITLE_JSON}}", "item": "{{CANONICAL}}" }
        ]
      }
    ]
  }
  </script>

  <!-- Fonts: self-hosted in /assets/fonts (declared in styles.css) -->
  <link rel="preload" href="/assets/fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/outfit-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>

  <!-- Compiled stylesheet -->
  <link rel="stylesheet" href="/assets/css/styles.css">
</head>

<body class="bg-tims-cream text-stone-800 font-sans antialiased min-h-screen flex flex-col">

{{HEADER}}

  <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-10 w-full flex-1">

    <!-- Breadcrumb -->
    <nav aria-label="Breadcrumb">
      <ol class="flex flex-wrap items-center gap-2 text-xs font-semibold text-stone-500">
        <li><a href="/" class="hover:text-tims-red transition-colors">Home</a></li>
        <li aria-hidden="true" class="text-stone-300">/</li>
        <li aria-current="page" class="text-stone-800">{{TITLE}}</li>
      </ol>
    </nav>

    <!-- Page Card -->
    <article class="mt-4 bg-white rounded-3xl p-6 sm:p-10 border border-stone-200 shadow-xl">
      <div class="flex flex-wrap items-center justify-between gap-3 pb-6 border-b border-stone-200">
        <h1 class="text-2xl sm:text-3xl font-display font-extrabold text-stone-900">{{TITLE}}</h1>
        <span class="text-xs uppercase font-bold text-tims-red bg-red-50 border border-red-200 px-3 py-1 rounded-full">{{BADGE}}</span>
      </div>

      <div class="mt-8 space-y-6 text-stone-700">
{{CONTENT}}
      </div>

      <div class="mt-10 pt-6 border-t border-stone-200 flex flex-wrap items-center justify-between gap-4">
        <p class="text-xs text-stone-400">Last updated: {{UPDATED}}</p>
        <a href="/" class="inline-flex items-center gap-2 text-xs font-bold text-stone-600 hover:text-white bg-stone-100 hover:bg-tims-red px-4 py-2 rounded-xl transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
          <span>Back to the Menu</span>
        </a>
      </div>
    </article>
  </main>

{{FOOTER}}

  <script src="/assets/js/site.js" defer></script>
</body>
</html>
